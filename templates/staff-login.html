<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>DESKFLOW</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<main class="staff-login-page"><div class="staff-login-card"><a href="/" class="staff-logo">DESKFLOW<span>.</span></a><p class="eyebrow">STAFF PORTAL</p><h1>Welcome<br><em>back.</em></h1><p class="staff-subtitle">Sign in to manage your hotel operations.</p>
{% with messages=get_flashed_messages() %}{% for m in messages %}<p>{{m}}</p>{% endfor %}{% endwith %}
<form method="post"><div class="staff-field"><label>WORK EMAIL</label><input type="email" name="email" placeholder="admin@deskflow.com" required></div><div class="staff-field"><label>PASSWORD</label><input type="password" name="password" placeholder="Enter your password" required></div><button class="staff-login-btn" type="submit">Sign in →</button></form><p class="secure-text">Demo: admin@deskflow.com / admin123</p><a href="/" class="back-home">← Back to DESKFLOW</a></div></main>
