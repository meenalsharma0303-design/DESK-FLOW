<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DESKFLOW — Staff Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="staff-login-page">

        <div class="staff-login-card">

            <a href="index.html" class="staff-logo">
                DESKFLOW<span>.</span>
            </a>

            <p class="eyebrow">
                STAFF PORTAL
            </p>

            <h1>
                Welcome<br>
                <em>back.</em>
            </h1>

            <p class="staff-subtitle">
                Sign in to manage your hotel operations.
            </p>

            <form>

                <div class="staff-field">

                    <label for="email">
                        WORK EMAIL
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="staff@deskflow.com"
                    >

                </div>


                <div class="staff-field">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                </div>


                <a href="dashboard.html" class="staff-login-btn">
                    Sign in
                    <span>→</span>
                </a>

            </form>

            <a href="index.html" class="back-home">
                ← Back to DESKFLOW
            </a>

        </div>

    </main>

</body>

</html>
